<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gallery | Family Planner</title>
		<style>
			:root {
				--ink: #17324d;
				--muted: #617487;
				--paper: #f7f4ed;
				--coral: #e87961;
				--mint: #b9d8c2;
				--line: rgba(23, 50, 77, 0.16);
			}

			* { box-sizing: border-box; }

			body {
				margin: 0;
				min-height: 100vh;
				padding: 30px 5vw 64px;
				color: var(--ink);
				font-family: Georgia, "Times New Roman", serif;
				background: var(--paper);
			}

			body::before {
				content: "";
				position: fixed;
				inset: 0;
				z-index: -1;
				opacity: 0.35;
				background-image: radial-gradient(rgba(23, 50, 77, 0.13) 0.7px, transparent 0.7px);
				background-size: 16px 16px;
			}

			.site-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 24px;
				max-width: 1180px;
				margin: 0 auto;
			}

			.brand {
				color: var(--ink);
				font-size: 1.15rem;
				font-weight: 700;
				letter-spacing: 0.02em;
				text-decoration: none;
			}

			.site-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
			.nav-link {
				color: var(--ink);
				padding: 8px 12px;
				border: 1px solid transparent;
				border-radius: 3px;
				font-family: Arial, Helvetica, sans-serif;
				font-size: 0.82rem;
				text-decoration: none;
			}
			.nav-link:hover, .nav-link[aria-current="page"] { border-color: var(--line); background: rgba(255,255,255,.55); }

			main { max-width: 1180px; margin: 86px auto 0; }
			.eyebrow { margin: 0 0 14px; color: var(--coral); font: 700 .75rem/1 Arial, Helvetica, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
			h1 { max-width: 650px; margin: 0; font-size: clamp(3.2rem, 8vw, 7.2rem); font-weight: 400; line-height: .9; letter-spacing: -.055em; }
			.intro { max-width: 520px; margin: 28px 0 54px; color: var(--muted); font: 1.05rem/1.65 Arial, Helvetica, sans-serif; }

			.gallery { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
			figure { margin: 0; }
			.gallery figure:nth-child(1) { grid-column: span 7; }
			.gallery figure:nth-child(2) { grid-column: span 5; }
			.gallery figure:nth-child(3), .gallery figure:nth-child(4), .gallery figure:nth-child(5) { grid-column: span 4; }
			img { display: block; width: 100%; height: 310px; object-fit: cover; border-radius: 3px; filter: saturate(.85); }
			.gallery figure:nth-child(1) img { height: 420px; }
			figcaption { display: flex; justify-content: space-between; gap: 12px; padding-top: 11px; border-top: 1px solid var(--line); margin-top: 10px; font-size: .95rem; }
			figcaption span { color: var(--muted); font: .7rem/1 Arial, Helvetica, sans-serif; letter-spacing: .08em; text-transform: uppercase; }

			@media (max-width: 700px) {
				body { padding: 22px 22px 48px; }
				.site-header { align-items: flex-start; flex-direction: column; }
				.site-nav { justify-content: flex-start; }
				main { margin-top: 64px; }
				.gallery { display: block; }
				.gallery figure { margin-bottom: 28px; }
				img, .gallery figure:nth-child(1) img { height: 280px; }
			}
		</style>
	</head>
	<body>
		<header class="site-header">
			<a class="brand" href="index.html">Family Planner</a>
			<nav class="site-nav" aria-label="Main navigation">
				<a class="nav-link" href="index.html">Home</a>
				<a class="nav-link" href="about.html">About</a>
				<a class="nav-link" href="gallary.html" aria-current="page">Gallery</a>
				<a class="nav-link" href="calendar.html">Calendar</a>
				<a class="nav-link" href="contact.html">Contact</a>
			</nav>
		</header>

		<main>
			<p class="eyebrow">Life, collected</p>
			<h1>Small moments, shared well.</h1>
			<p class="intro">A visual scrapbook of the rituals, places, and pauses that make a week feel like yours.</p>

			<section class="gallery" aria-label="Family Planner gallery">
				<figure>
					<img src="https://images.unsplash.com/photo-1504150558240-0b4fd8946624?auto=format&fit=crop&w=1200&q=85" alt="Family walking together beside a lake" />
					<figcaption>Out in the open <span>Weekends</span></figcaption>
				</figure>
				<figure>
					<img src="https://images.unsplash.com/photo-1543339308-43e59d6b73a6?auto=format&fit=crop&w=900&q=85" alt="Fresh meal prepared on a kitchen table" />
					<figcaption>Made together <span>Meals</span></figcaption>
				</figure>
				<figure>
					<img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85" alt="Sunny path through a green landscape" />
					<figcaption>Take the long way <span>Adventures</span></figcaption>
				</figure>
				<figure>
					<img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=900&q=85" alt="Notebook and coffee ready for planning" />
					<figcaption>Make space <span>Routines</span></figcaption>
				</figure>
				<figure>
					<img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=900&q=85" alt="Child playing outside in warm sunlight" />
					<figcaption>Room to play <span>Everyday</span></figcaption>
				</figure>
			</section>
		</main>
	</body>
</html>
