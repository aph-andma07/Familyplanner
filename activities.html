<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activities | Family Planner</title>
    <style>
      :root {
        --ink: #17324d;
        --muted: #687b8b;
        --paper: #f7f4ed;
        --card: rgba(255, 255, 255, 0.72);
        --coral: #e87961;
        --mint: #b9d8c2;
        --line: rgba(23, 50, 77, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 30px 5vw 64px;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        background: var(--paper);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.35;
        background-image: radial-gradient(rgba(23, 50, 77, 0.13) 0.7px, transparent 0.7px);
        background-size: 16px 16px;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        max-width: 1180px;
        margin: 0 auto;
      }

      .brand { color: var(--ink); font-size: 1.15rem; font-weight: 700; text-decoration: none; }
      .site-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
      .nav-link {
        color: var(--ink);
        padding: 8px 12px;
        border: 1px solid transparent;
        border-radius: 3px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.82rem;
        text-decoration: none;
      }
      .nav-link:hover, .nav-link[aria-current="page"] { border-color: var(--line); background: rgba(255,255,255,.55); }

      main { max-width: 760px; margin: 82px auto 0; }
      .eyebrow { margin: 0 0 14px; color: var(--coral); font: 700 .75rem/1 Arial, Helvetica, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3.2rem, 8vw, 6.5rem); font-weight: 400; line-height: .9; letter-spacing: -.055em; }
      .intro { max-width: 540px; margin: 26px 0 38px; color: var(--muted); font: 1.05rem/1.65 Arial, Helvetica, sans-serif; }

      .activity-panel { padding: 24px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); box-shadow: 0 10px 24px rgba(23,50,77,.05); }
      .activity-form { display: flex; gap: 10px; margin-bottom: 20px; }
      .activity-input { flex: 1; min-width: 0; padding: 12px 14px; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; background: rgba(255,255,255,.75); font: 1rem Arial, Helvetica, sans-serif; }
      .activity-input:focus { outline: 2px solid var(--mint); outline-offset: 2px; }
      .add-button { padding: 12px 18px; color: #fff; border: 0; border-radius: 3px; background: var(--coral); cursor: pointer; font: 700 .9rem Arial, Helvetica, sans-serif; }
      .add-button:hover { background: #d96550; }
      .activity-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
      .activity-item { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-top: 1px solid var(--line); font: 1rem Arial, Helvetica, sans-serif; }
      .activity-item input { width: 18px; height: 18px; accent-color: var(--coral); }
      .activity-item label { flex: 1; cursor: pointer; }
      .activity-item.completed label { color: var(--muted); text-decoration: line-through; }
      .remove-button { padding: 5px 8px; color: var(--muted); border: 1px solid transparent; background: transparent; cursor: pointer; font: .78rem Arial, Helvetica, sans-serif; }
      .remove-button:hover { color: var(--coral); border-color: var(--line); }
      .list-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; color: var(--muted); font: .78rem Arial, Helvetica, sans-serif; }
      .clear-button { padding: 0; color: var(--coral); border: 0; background: transparent; cursor: pointer; font: inherit; }
      .clear-button:hover { text-decoration: underline; }

      @media (max-width: 700px) {
        body { padding: 22px 22px 48px; }
        .site-header { align-items: flex-start; flex-direction: column; }
        .site-nav { justify-content: flex-start; }
        main { margin-top: 64px; }
        .activity-form { align-items: stretch; flex-direction: column; }
        .add-button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Family Planner</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="gallary.html">Gallery</a>
        <a class="nav-link" href="calendar.html">Calendar</a>
        <a class="nav-link" href="activities.html" aria-current="page">Activities</a>
        <a class="nav-link" href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <p class="eyebrow">Together this week</p>
      <h1>Activities</h1>
      <p class="intro">Keep the small plans visible. Add an activity, check it off when it is done, and make room for the next good idea.</p>

      <section class="activity-panel" aria-labelledby="activity-list-title">
        <h2 id="activity-list-title" hidden>Family activities</h2>
        <form class="activity-form" id="activity-form">
          <label class="sr-only" for="activity-input">New activity</label>
          <input class="activity-input" id="activity-input" name="activity" type="text" placeholder="Add an activity..." autocomplete="off" required />
          <button class="add-button" type="submit">Add activity</button>
        </form>
        <ul class="activity-list" id="activity-list"></ul>
        <div class="list-footer">
          <span id="activity-count">0 activities left</span>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>
      </section>
    </main>

    <script>
      const storageKey = "family-planner-activities";
      const defaultActivities = [
        { text: "Plan Saturday breakfast", completed: false },
        { text: "Take a walk together", completed: false },
        { text: "Choose a family movie", completed: true }
      ];
      const form = document.querySelector("#activity-form");
      const input = document.querySelector("#activity-input");
      const list = document.querySelector("#activity-list");
      const count = document.querySelector("#activity-count");
      const clearCompleted = document.querySelector("#clear-completed");
      let activities = JSON.parse(localStorage.getItem(storageKey)) || defaultActivities;

      function saveActivities() {
        localStorage.setItem(storageKey, JSON.stringify(activities));
      }

      function renderActivities() {
        list.innerHTML = "";
        activities.forEach((activity, index) => {
          const item = document.createElement("li");
          item.className = `activity-item${activity.completed ? " completed" : ""}`;
          item.innerHTML = `<input type="checkbox" id="activity-${index}" ${activity.completed ? "checked" : ""}><label for="activity-${index}"></label><button class="remove-button" type="button" aria-label="Remove activity">Remove</button>`;
          item.querySelector("label").textContent = activity.text;
          item.querySelector("input").addEventListener("change", () => {
            activity.completed = !activity.completed;
            saveActivities();
            renderActivities();
          });
          item.querySelector(".remove-button").addEventListener("click", () => {
            activities.splice(index, 1);
            saveActivities();
            renderActivities();
          });
          list.appendChild(item);
        });
        const remaining = activities.filter((activity) => !activity.completed).length;
        count.textContent = `${remaining} ${remaining === 1 ? "activity" : "activities"} left`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        activities.push({ text, completed: false });
        saveActivities();
        renderActivities();
        form.reset();
        input.focus();
      });

      clearCompleted.addEventListener("click", () => {
        activities = activities.filter((activity) => !activity.completed);
        saveActivities();
        renderActivities();
      });

      renderActivities();
    </script>
  </body>
</html>
