<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Planner</title>
    <style>
      :root { --ink: #17324d; --muted: #687b8b; --paper: #f7f4ed; --coral: #e87961; --mint: #b9d8c2; --line: rgba(23,50,77,.14); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 30px 5vw 64px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; background: var(--paper); }
      body::before { content: ""; position: fixed; inset: 0; z-index: -1; opacity: .35; background-image: radial-gradient(rgba(23,50,77,.13) .7px, transparent .7px); background-size: 16px 16px; }
      .site-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; max-width: 1180px; margin: 0 auto; }
      .brand { color: var(--ink); font-size: 1.15rem; font-weight: 700; text-decoration: none; }
      .site-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
      .nav-link { color: var(--ink); padding: 8px 12px; border: 1px solid transparent; border-radius: 3px; font: .82rem Arial, sans-serif; text-decoration: none; }
      .nav-link:hover, .nav-link[aria-current="page"] { border-color: var(--line); background: rgba(255,255,255,.55); }
      main { max-width: 760px; margin: 130px auto 0; }
      .eyebrow { margin: 0 0 14px; color: var(--coral); font: 700 .75rem/1 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3.2rem, 8vw, 7rem); font-weight: 400; line-height: .9; letter-spacing: -.055em; }
      p { max-width: 540px; margin: 26px 0 0; color: var(--muted); font: 1.05rem/1.65 Arial, sans-serif; }
      .button-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      .button { padding: 11px 18px; border-radius: 3px; font: 700 .85rem Arial, sans-serif; text-decoration: none; }
      .button.primary { color: #fff; background: var(--coral); }
      .button.secondary { color: var(--ink); border: 1px solid var(--line); background: rgba(255,255,255,.55); }
      @media (max-width: 700px) { body { padding: 22px 22px 48px; } .site-header { align-items: flex-start; flex-direction: column; } .site-nav { justify-content: flex-start; } main { margin-top: 78px; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Family Planner</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html" aria-current="page">Home</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="gallary.html">Gallery</a>
        <a class="nav-link" href="calendar.html">Calendar</a>
        <a class="nav-link" href="activities.html">Activities</a>
        <a class="nav-link" href="admin.html">People & access</a>
        <a class="nav-link" href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <p class="eyebrow">Family Planner</p>
      <h1>Plan life together.</h1>
      <p>Creating a calmer week, one shared plan at a time.</p>

      <div class="button-row">
        <a class="button primary" href="contact.html">Get in touch</a>
        <a class="button secondary" href="about.html">Learn more</a>
      </div>
    </main>
  </body>
</html>
