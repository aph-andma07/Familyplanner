<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Planner</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1d4ed8;
        --accent: #67e8f9;
        --accent-2: #c084fc;
        --text: #e2e8f0;
        --glass: rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
      }

      body::before {
        background: rgba(103, 232, 249, 0.5);
        top: 10%;
        left: 10%;
      }

      body::after {
        background: rgba(192, 132, 252, 0.5);
        right: 10%;
        bottom: 12%;
      }

      .site-nav {
        position: fixed;
        top: 24px;
        right: 28px;
        z-index: 2;
        display: flex;
        gap: 8px;
      }

      .nav-link {
        color: var(--text);
        text-decoration: none;
        padding: 8px 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.28);
        font-size: 0.9rem;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .nav-link:hover,
      .nav-link[aria-current="page"] {
        background: rgba(103, 232, 249, 0.16);
        transform: translateY(-1px);
      }

      .card {
        position: relative;
        z-index: 1;
        padding: 48px 54px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(12px);
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 16px;
        margin-bottom: 20px;
        border-radius: 999px;
        background: rgba(103, 232, 249, 0.12);
        border: 1px solid rgba(103, 232, 249, 0.3);
        color: #dff9ff;
        letter-spacing: 1.5px;
        font-size: 12px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: 1;
        letter-spacing: -0.06em;
        background: linear-gradient(90deg, #ffffff, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 25px rgba(103, 232, 249, 0.2);
      }

      p {
        margin: 18px 0 0;
        font-size: 1.05rem;
        color: rgba(226, 232, 240, 0.8);
      }

      .button-row {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .button {
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button.primary {
        background: linear-gradient(90deg, var(--accent), #7dd3fc);
        color: #082f49;
        box-shadow: 0 10px 25px rgba(103, 232, 249, 0.35);
      }

      .button.secondary {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-link" href="index.html" aria-current="page">Home</a>
      <a class="nav-link" href="about.html">About</a>
      <a class="nav-link" href="gallary.html">Gallery</a>
      <a class="nav-link" href="contact.html">Contact</a>
    </nav>

    <div class="card">
      <div class="badge">Family Planner</div>
      <h1>Plan life together.</h1>
      <p>Creating a calmer week, one shared plan at a time.</p>

      <div class="button-row">
        <a class="button primary" href="contact.html">Get in touch</a>
        <a class="button secondary" href="about.html">Learn more</a>
      </div>
    </div>
  </body>
</html>
